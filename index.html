<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="description" content="RINO / 松藤 輪樽。会社・役職と連絡先。">
  <title>RINO | 松藤 輪樽</title>
  <style>
    :root { color-scheme: light; --paper: #f4f1e8; --ink: #173e32; --muted: #51665a; --line: #cbd0c2; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Avenir Next", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: min(100%, 620px); margin: auto; padding: 40px max(24px, env(safe-area-inset-right)) max(30px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
    header { border-top: 2px solid var(--ink); padding-top: 24px; }
    .eyebrow { margin: 0 0 12px; font-size: 10px; font-weight: 600; letter-spacing: .2em; }
    h1 { margin: 0 0 4px; font-family: "Baskerville", "Palatino Linotype", Georgia, serif; font-size: clamp(64px, 19vw, 94px); line-height: 1; font-weight: 400; letter-spacing: -.025em; }
    .name { margin: 10px 0 0; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 20px; letter-spacing: .15em; }
    .affiliations { margin: 32px 0 26px; }
    .company { position: relative; margin: 0; padding: 14px 0 13px 55px; border-top: 1px solid var(--line); }
    .company:last-child { border-bottom: 1px solid var(--line); }
    .company-logo { position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 39px; height: 36px; object-fit: contain; }
    .company-logo.anresco { width: 45px; left: -3px; }
    .company dt { font-size: 16px; font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
    .company dd { margin: 3px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; letter-spacing: .035em; }
    h2 { margin: 0 0 12px; font-size: 10px; letter-spacing: .2em; font-weight: 600; }
    .contact { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    a { color: inherit; text-decoration: none; }
    .contact a { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 17px; border: 1px solid var(--ink); font-size: 14px; font-weight: 500; }
    .contact .line { background: var(--ink); color: var(--paper); }
    .contact-copy { display: grid; gap: 5px; }
    .contact-action { font-size: 10px; font-weight: 400; line-height: 1.5; }
    .arrow { font-size: 18px; line-height: 1; }
    .email { display: flex; align-items: center; gap: 12px; min-height: 52px; margin-top: 7px; font-size: 12px; overflow-wrap: anywhere; }
    .email-label { color: var(--muted); font-size: 10px; letter-spacing: .1em; }
    a:focus-visible { outline: 3px solid #927039; outline-offset: 4px; }
    @media (hover: hover) { .contact a:hover { background: #e6e8dc; color: var(--ink); } .email:hover { text-decoration: underline; } }
    @media (min-width: 640px) { main { padding: 64px 42px 40px; } .affiliations { margin-top: 38px; } .company { padding-block: 17px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">PROFILE &amp; CONTACT</p>
      <h1>RINO</h1>
      <p class="name">松藤 輪樽</p>
    </header>
    <section class="affiliations" aria-label="会社・役職">
      <dl class="company"><dt><img class="company-logo" src="assets/dispensary-japan.png" alt="" width="39" height="36">Dispensary Japan 株式会社</dt><dd lang="en">Founder</dd></dl>
      <dl class="company"><dt><img class="company-logo" src="assets/la-flora.svg" alt="" width="39" height="36">La flora 株式会社</dt><dd lang="en">Founder</dd></dl>
      <dl class="company"><dt><img class="company-logo" src="assets/can-ai.svg" alt="" width="39" height="36">Can AI 合同会社</dt><dd lang="en">Representative Member</dd></dl>
      <dl class="company"><dt><img class="company-logo anresco" src="assets/anresco-japan.png" alt="" width="45" height="36">Anresco Japan株式会社</dt><dd lang="en">Strategic Advisor</dd></dl>
    </section>
    <section aria-labelledby="contact-title">
      <h2 id="contact-title">CONTACT</h2>
      <div class="contact">
        <a class="line" href="https://line.me/ti/p/4o6b8IowGt" aria-label="LINEでRINOのプロフィールを開く"><span class="contact-copy"><span>LINE</span><span class="contact-action">プロフィールを開く</span></span><span class="arrow" aria-hidden="true">↗</span></a>
        <a href="https://wa.me/818032294781" aria-label="WhatsAppでRINOとのチャットを開く"><span class="contact-copy"><span>WhatsApp</span><span class="contact-action">チャットを開く</span></span><span class="arrow" aria-hidden="true">↗</span></a>
      </div>
      <a class="email" href="mailto:rino@dispensaryjapan.com"><span class="email-label">EMAIL</span><span>rino@dispensaryjapan.com</span></a>
    </section>
  </main>
</body>
</html>
